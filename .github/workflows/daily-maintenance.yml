name: Six-hour repository maintenance

on:
  schedule:
    - cron: "35 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: six-hour-repository-maintenance
  cancel-in-progress: false

jobs:
  update-maintenance-log:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Record the maintenance run
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "Anant123n"
          git config user.email "anantagrawal140@gmail.com"

          mkdir -p .github/maintenance
          date -u +"Last automated maintenance: %Y-%m-%dT%H:%M:%SZ" > .github/maintenance/last-run.txt
          git add .github/maintenance/last-run.txt

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          git commit -m "chore: record scheduled maintenance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
